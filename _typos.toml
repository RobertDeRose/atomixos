[default]
extend-ignore-re = ["[0-9a-f]{7,40}"]

[default.extend-words]
# nftables input interface shorthand — not a typo of "if"
iif = "iif"
# Linux kernel config options (Chrome OS, Heterogeneous System Architecture)
CROS = "CROS"
HSA = "HSA"
# Cockpit storage module package name
storaged = "storaged"
# Device product naming used in local tutorial examples.
som = "som"
# Valid hardware and watchdog vendor names.
Synopsys = "Synopsys"
