name: Validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  validate:
    name: Validate (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04-arm
            system: aarch64-linux
            timeout: 45
          - runner: macos-latest
            system: aarch64-darwin
            timeout: 45
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Configure mise environment
        run: echo "MISE_IGNORED_CONFIG_PATHS=$HOME/.config/mise/config.toml" >> "$GITHUB_ENV"
      - name: Set up Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
      - name: Verify Nix platform
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.system }}"
      - name: Set up mise
        uses: jdx/mise-action@4444d8fd7a1b92f1821c12f435db40f58b743d26 # v4.0.1
        with:
          install: false
      - name: Install locked tools
        run: mise install --locked
      - name: Run repository checks
        run: hk check -a --skip-step nix
      - name: Evaluate Nix checks
        # Each runner evaluates its own platform without building checks.
        run: ./scripts/nix-with-build-config.sh flake check --no-build --system "${{ matrix.system }}"
