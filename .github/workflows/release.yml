name: Release
run-name: Release from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Check out the selected development commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@4444d8fd7a1b92f1821c12f435db40f58b743d26 # v4.0.1
        with:
          install: false
      - name: Install locked Cocogitto
        run: mise install --locked cocogitto
      - name: Compute version and release notes
        id: plan
        env:
          MISE_IGNORED_CONFIG_PATHS: /home/runner/.config/mise/config.toml
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git ls-remote --refs origin refs/heads/main > "$RUNNER_TEMP/main-ref"
          if [ -s "$RUNNER_TEMP/main-ref" ]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor FETCH_HEAD "$sha"
          fi
          tag=$(mise x cocogitto -- cog bump --auto --dry-run)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # This local-only tag lets the changelog template render the planned version.
          git tag "$tag" "$sha"
          mise x cocogitto -- cog changelog --at "$tag" > release-notes.md
          {
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Release source: \`$sha\`"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save planned release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  quality:
    name: Repository checks
    needs: plan
    uses: ./.github/workflows/hk.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.plan.outputs.sha }}

  nix:
    name: Nix checks
    needs: plan
    uses: ./.github/workflows/nix.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.plan.outputs.sha }}

  pytest:
    name: Python tests
    needs: plan
    uses: ./.github/workflows/pytest.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.plan.outputs.sha }}

  artifacts:
    name: Build (${{ matrix.board }})
    needs: plan
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        board: [rock64, cm3]
    steps:
      - name: Check out the release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Set up Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
      - name: Build and package the board artifacts
        env:
          BOARD: ${{ matrix.board }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/nix-with-build-config.sh build ".#$BOARD" -o result-release
          mkdir release-assets
          archive="atomixos-$BOARD-$TAG.tar.xz"
          # The board output is a link farm; include the artifacts, not store symlinks.
          tar --dereference --create --xz --file "release-assets/$archive" --directory result-release .
          cd release-assets
          sha256sum "$archive" > "$archive.sha256"
      - name: Save board release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-board-${{ matrix.board }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Approve and publish release
    needs: [plan, quality, nix, pytest, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require the environment-scoped release key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: test -n "$RELEASE_DEPLOY_KEY"
      - name: Check out the validated release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Download planned release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: release-notes
      - name: Download board release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-board-*
          path: release-assets
          merge-multiple: true
      - name: Atomically fast-forward main and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/release-refs.sh "$SHA" "$TAG"
      - name: Publish the complete GitHub release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            # A successful publication is already complete; never replace its assets on a rerun.
            if [ "$(cat "$RUNNER_TEMP/is-draft")" = false ]; then
              exit 0
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes-file release-notes/release-notes.md
          fi
          gh release upload "$TAG" release-assets/*.tar.xz release-assets/*.sha256 --clobber
          gh release edit "$TAG" --draft=false --latest
