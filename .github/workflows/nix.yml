name: Nix evaluation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  evaluate:
    name: Evaluate (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
      - name: Verify Nix platform
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.system }}"
      - name: Evaluate Nix checks
        # Each runner evaluates its own platform without building checks.
        run: ./scripts/nix-with-build-config.sh flake check --no-build --system "${{ matrix.system }}"

  uboot-scripts:
    # Separate job, so it runs in parallel with the evaluations above.
    name: U-Boot scripts (sandbox)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix store paths
        # Reuses store paths built by earlier runs through the GitHub Actions cache.
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # Pin the cache daemon build too; without this the action downloads its latest main build.
          source-revision: 58598f7d5b3112e0a7edd335ef6b3769ccc8637d
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Run boot.scr and PREBOOT in a U-Boot sandbox
        # Builds a U-Boot sandbox binary and executes the compiled boot script
        # and the START_UMS PREBOOT, which U-Boot only parses at boot time.
        run: ./scripts/nix-with-build-config.sh build --no-link --print-build-logs .#checks.aarch64-linux.uboot-scripts
