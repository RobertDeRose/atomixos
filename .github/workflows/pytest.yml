name: Provisioning tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  pytest:
    # The device runs aarch64 Linux; host-only fixtures emulate Linux file APIs on macOS.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/atomixos_provision
    env:
      MISE_IGNORED_CONFIG_PATHS: /home/runner/.config/mise/config.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@4444d8fd7a1b92f1821c12f435db40f58b743d26 # v4.0.1
        with:
          install: false
      - name: Install uv
        # Only uv is needed; do not install the rest of the project toolchain.
        run: mise install uv
      - name: Run provisioning package tests
        env:
          # `mise x` would otherwise install every tool in mise.toml before running.
          MISE_EXEC_AUTO_INSTALL: "false"
        # Pin the interpreter to the nixpkgs python3 series the device ships, not the runner's.
        run: mise x uv -- uv run --python 3.13 --extra dev pytest
