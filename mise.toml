#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
env_shell_expand = true
# Platforms recorded in mise.lock; keeps CI from completing entries for other platforms.
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]

[tools]
"aqua:Mic92/nixfmt-rs" = "latest"
"cargo:deadnix" = "latest"
"github:KevinGimbel/mktoc" = "latest"
"npm:@commitlint/cli" = "latest"
"npm:@contextlint/cli" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:markdown-table-formatter" = "latest"
actionlint = "latest"
cargo-binstall = "latest"
cocogitto = "latest"
hk = "latest"
node = "lts"
pkl = "latest"
ruff = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
typos = "latest"
uv = "latest"

[env]
GIT_CONFIG_PARAMETERS = "'merge.ff=only'"
HK_MISE = 1
_.file = ".env"

[hooks]
# Partial installs (CI installing only uv) have no hk; skip the Git hook setup instead of failing.
postinstall = "if command -v hk >/dev/null 2>&1; then hk install --mise; fi"

# ── Tasks ──────────────────────────────────────────────────────────────────────

[tasks.check]
description = "Run repository validation"
run = "hk check -a"

[tasks.fix]
description = "Apply deterministic repository fixes"
run = "hk fix -a"

[tasks."docs:install"]
description = "Install the documentation site dependencies from the npm lockfile"
dir = "docs"
sources = ["package-lock.json", "package.json"]
outputs = ["node_modules/.package-lock.json"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

# mise also reruns this task whenever mise.toml changes, so skip npm ci when node_modules already matches the lockfile.
stamp=node_modules/.package-lock.sha256
want=$(shasum -a 256 package-lock.json | cut -d' ' -f1)
if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$want" ]; then
  echo "node_modules already matches package-lock.json"
  exit 0
fi
# npm ci removes node_modules first, which can fail with ENOTEMPTY on macOS while new files are still being indexed;
# one retry clears it.
npm ci --no-fund --no-audit || { sleep 2; npm ci --no-fund --no-audit; }
echo "$want" >"$stamp"
'''

[tasks."docs:build"]
description = "Build the documentation site (Docusaurus) into docs/build"
depends = ["docs:install"]
dir = "docs"
run = "npm run build"

[tasks."docs:serve"]
description = "Serve the documentation site locally with hot-reload"
depends = ["docs:install"]
dir = "docs"
usage = 'arg "[port]" help="Port to serve on" default="3000"'
run = 'npm run start -- --port "${usage_port:-3000}"'

[tasks."site:build"]
description = "Assemble the Pages site: the product page at the root and the docs under docs/"
depends = ["docs:build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Pages serves the site from /atomixos/, so the output keeps that path for local previews.
out=_site/atomixos
fonts=docs/node_modules/@fontsource-variable
rm -rf _site
mkdir -p "$out/fonts"
cp -R product/. "$out/"
cp -R docs/build "$out/docs"
# GitHub Pages serves 404.html from the site root for every missing path.
cp docs/build/404.html "$out/404.html"
cp "$fonts/exo-2/files/exo-2-latin-wght-normal.woff2" \
  "$fonts/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2" \
  "$fonts/atkinson-hyperlegible-mono/files/atkinson-hyperlegible-mono-latin-wght-normal.woff2" \
  "$out/fonts/"

# The docs build checks the docs' own links; check the product page's relative links against the assembled site,
# resolving them the way Pages does (the file, <path>.html, or <path>/index.html).
broken=0
for ref in $(grep -oE '(href|src)="[^"]*"' product/index.html | sed -E 's/^(href|src)="//; s/"$//' | sort -u); do
  # Skip absolute URLs and in-page anchors; check the path part of everything else.
  case "$ref" in *:* | '#'* | '') continue ;; esac
  ref=${ref%%#*}
  target="$out/${ref%/}"
  if [ -f "$target" ] || [ -f "$target.html" ] || [ -f "$target/index.html" ]; then
    continue
  fi
  echo "product/index.html: broken link: $ref" >&2
  broken=1
done
exit "$broken"
'''

[tasks."site:serve"]
description = "Build the Pages site and serve it at http://localhost:<port>/atomixos/"
depends = ["site:build"]
usage = 'arg "[port]" help="Port to serve on" default="8000"'
run = 'python3 scripts/serve-pages.py "${usage_port:-8000}" _site'

[tasks."docs:deployment:enable"]
description = "Enable GitHub Pages deployment"
run = "python3 scripts/enable-docs-deployment.py"

[tasks._lima]
description = "Ensure Lima VM is running (hidden helper)"
hide = true
usage = 'arg "<vm>" help="Lima VM instance name" default="default"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if ! command -v limactl &>/dev/null; then
  echo "ERROR: limactl not found. Install Lima: https://lima-vm.io/"
  exit 1
fi
limactl start "${usage_vm}" 2>/dev/null || true
"""

[tasks."build:squashfs"]
description = "Build squashfs rootfs"
usage = """
flag "--board <board>" help="Target board" default="rock64" {
  choices "rock64" "cm3"
}
flag "--lima" help="Build inside a Lima VM"
flag "--vm <name>" help="Lima VM instance name" default="default"
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
board="${usage_board:-rock64}"
cmd=()
if [ "${usage_lima:-false}" = "true" ]; then
  mise run _lima "${usage_vm}"
  cmd+=(limactl shell "${usage_vm}" --)
fi
"${cmd[@]}" ./scripts/nix-with-build-config.sh build ".#$board.squashfs" -o "result-$board-squashfs"
"""

[tasks."build:rauc-bundle"]
description = "Build signed RAUC bundle"
usage = """
flag "--board <board>" help="Target board" default="rock64" {
  choices "rock64" "cm3"
}
flag "--lima" help="Build inside a Lima VM"
flag "--vm <name>" help="Lima VM instance name" default="default"
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
board="${usage_board:-rock64}"
cmd=()
if [ "${usage_lima:-false}" = "true" ]; then
  mise run _lima "${usage_vm}"
  cmd+=(limactl shell "${usage_vm}" --)
fi
"${cmd[@]}" ./scripts/nix-with-build-config.sh build ".#$board.rauc-bundle" -o "result-$board-rauc-bundle"
"""

[tasks."build:boot-script"]
description = "Build U-Boot boot script"
usage = """
flag "--board <board>" help="Target board" default="rock64" {
  choices "rock64" "cm3"
}
flag "--lima" help="Build inside a Lima VM"
flag "--vm <name>" help="Lima VM instance name" default="default"
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
board="${usage_board:-rock64}"
cmd=()
if [ "${usage_lima:-false}" = "true" ]; then
  mise run _lima "${usage_vm}"
  cmd+=(limactl shell "${usage_vm}" --)
fi
"${cmd[@]}" ./scripts/nix-with-build-config.sh build ".#$board.boot-script" -o "result-$board-boot-script"
"""

[tasks."vm:bundle-test"]
description = "Run a QEMU VM for testing config.toml bundles"
usage = """
flag "--build-only" help="Only build the VM runner"
flag "--root-debug" help="Boot a debug VM with root autologin on the serial console"
"""
run = """
#!/usr/bin/env bash
set -euo pipefail

./scripts/nix-with-build-config.sh build .#nixosConfigurations.bundle-test-vm.config.system.build.vm -o result-bundle-test-vm

runner=./result-bundle-test-vm/bin/run-gateway-vm
host_runner="$runner"
if [ "$(uname -s)" = "Darwin" ]; then
  host_bash=$(nix build --no-link --print-out-paths nixpkgs#legacyPackages.aarch64-darwin.bash.out)
  host_coreutils=$(nix build --no-link --print-out-paths nixpkgs#legacyPackages.aarch64-darwin.coreutils.out)
  # Keep the macOS interactive VM on QEMU 10.1.5. QEMU 11.0.0 currently
  # asserts in the aarch64 HVF sysreg path before the guest boots.
  host_qemu=$(nix build --no-link --print-out-paths github:NixOS/nixpkgs/4e92bbcdb030f3b4782be4751dc08e6b6cb6ccf2#legacyPackages.aarch64-darwin.qemu.out)
  host_e2fsprogs=$(nix build --no-link --print-out-paths nixpkgs#legacyPackages.aarch64-darwin.e2fsprogs.bin)

  host_runner=./.bundle-test-vm-runner
  rm -f "$host_runner"
  cp "$runner" "$host_runner"
  chmod +x "$host_runner"
  HOST_BASH="$host_bash" \
  HOST_COREUTILS="$host_coreutils" \
  HOST_QEMU="$host_qemu" \
  HOST_E2FSPROGS="$host_e2fsprogs" \
    perl -0pi \
      -e 's{^#! .*?/bin/bash}{"#! $ENV{HOST_BASH}/bin/bash"}me;
          s{export PATH=.*?/bin}{"export PATH=$ENV{HOST_COREUTILS}/bin"}e;
          s{/nix/store/[^[:space:]]+-qemu-[^/]+/bin/qemu-img}{"$ENV{HOST_QEMU}/bin/qemu-img"}ge;
          s{/nix/store/[^[:space:]]+-qemu-[^/]+/bin/qemu-system-aarch64}{"$ENV{HOST_QEMU}/bin/qemu-system-aarch64"}ge;
          s{/nix/store/[^[:space:]]+-e2fsprogs-[^/]+/bin/mkfs.ext4}{"$ENV{HOST_E2FSPROGS}/bin/mkfs.ext4"}ge;' \
      "$host_runner"
  perl -0pi -e 's{accel=kvm:tcg}{accel=hvf:tcg}g' "$host_runner"
fi

if [ "${usage_root_debug:-false}" = "true" ]; then
  export QEMU_KERNEL_PARAMS="${QEMU_KERNEL_PARAMS:-} atomixos.bundle-test.root-debug=1"
  cat <<'EOF'
Bundle test VM ports:
  Bootstrap: http://127.0.0.1:8080
  HTTP:      http://127.0.0.1:8081
  HTTPS:     https://127.0.0.1:8443

Root debug mode enabled:
  Serial console autologins as root.
  Normal appliance authentication assumptions do not apply.
EOF
else
  cat <<'EOF'
Bundle test VM ports:
  SSH:       ssh -p 10022 admin@127.0.0.1
  Bootstrap: http://127.0.0.1:8080
  HTTP:      http://127.0.0.1:8081
  HTTPS:     https://127.0.0.1:8443

Apply an example bundle with:
  curl -F config_file=@config.tar.zst http://127.0.0.1:8080/apply
EOF
fi

if [ "${usage_build_only:-false}" = "true" ]; then
  exit 0
fi

for port in 10022 8080 8081 8443; do
  if lsof -nP -iTCP:"$port" -sTCP:LISTEN >/dev/null 2>&1; then
    echo "Host port $port is already in use; stop that process or edit vm:bundle-test ports." >&2
    lsof -nP -iTCP:"$port" -sTCP:LISTEN >&2 || true
    exit 1
  fi
done

export QEMU_NET_OPTS="hostfwd=tcp:127.0.0.1:10022-:22,hostfwd=tcp:127.0.0.1:8081-:80,hostfwd=tcp:127.0.0.1:8443-:443"
vm_state_dir=$(mktemp -d "${TMPDIR:-/tmp}/atomixos-bundle-test-vm.XXXXXXXXXX")
trap 'rm -rf "$vm_state_dir"' EXIT
export NIX_DISK_IMAGE="$vm_state_dir/gateway.qcow2"
exec "$host_runner"
"""

[tasks.build]
description = "Build every artifact for a board into .gcroots/<board>/current, keeping the previous build"
usage = """
flag "--board <board>" help="Target board" default="rock64" {
  choices "rock64" "cm3"
}
flag "--lima" help="Build inside a Lima VM"
flag "--vm <name>" help="Lima VM instance name" default="default"
flag "-o --output <path>" help="Copy .img to this path (default: retain under .gcroots)"
"""
run = "./scripts/build.sh"

[tasks.gc]
description = "Garbage collect Nix store paths not kept by .gcroots/<board>/ or other roots"
usage = """
flag "--lima" help="Run inside a Lima VM"
flag "--vm <name>" help="Lima VM instance name" default="default"
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
cmd=()
if [ "${usage_lima:-false}" = "true" ]; then
  mise run _lima "${usage_vm}"
  cmd+=(limactl shell "${usage_vm}" --)
fi

"${cmd[@]}" nix-collect-garbage -d
"""

[tasks.e2e]
description = "Run all E2E integration tests"
usage = """
flag "--lima" help="Run E2E tasks inside a Lima VM"
flag "--vm <name>" help="Lima VM instance name" default="default"
"""
run = """
#!/usr/bin/env bash
set -euo pipefail

args=()
if [ "${usage_lima:-false}" = "true" ]; then
  args+=(--lima)
  args+=(--vm "${usage_vm}")
fi

mise run e2e:rauc-slots "${args[@]}"
mise run e2e:rauc-update "${args[@]}"
mise run e2e:rauc-rollback "${args[@]}"
mise run e2e:rauc-confirm "${args[@]}"
mise run e2e:rauc-power-loss "${args[@]}"
mise run e2e:rauc-watchdog "${args[@]}"
mise run e2e:firewall "${args[@]}"
mise run e2e:network-isolation "${args[@]}"
mise run e2e:ssh-wan-toggle "${args[@]}"
"""
